<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Live Departures</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <div id="board">
      <header id="header">
        <div id="station-name">Loading...</div>
        <div id="clock"></div>
      </header>
      <div id="toolbar">
        <div id="station-search-wrap">
          <input type="text" id="station-search" placeholder="Search station..." autocomplete="off" />
          <div id="station-results"></div>
        </div>
        <button id="calling-at-toggle" type="button">Calling at: OFF</button>
      </div>
      <div id="column-headers">
        <span class="col-time">Time</span>
        <span class="col-destination">Destination</span>
        <span class="col-plat">Plat</span>
        <span class="col-expected">Expected</span>
        <span class="col-operator">Operator</span>
      </div>
      <div id="departures"></div>
      <footer id="footer">
        <span id="updated"></span>
        <span id="next-refresh"></span>
      </footer>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
